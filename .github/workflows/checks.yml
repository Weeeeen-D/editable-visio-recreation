name: Static checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validator regressions
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check the included synthetic output
        run: python scripts/validate_vsdx.py examples/demo.vsdx --profile source

